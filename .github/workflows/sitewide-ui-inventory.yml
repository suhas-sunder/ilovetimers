name: Full 132-page UI inventory (audit only)
on:
  push:
    branches:
      - audit/2026-11-19-sitewide-ui-review
    paths:
      - ai-issues/full-inventory-ci-trigger.txt
jobs:
  sitewide-browser-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/tests/sitewide-visual-matrix.mjs
        env:
          ILT_VISUAL_INVENTORY_DIR: sitewide-inventory-evidence
          ILT_VISUAL_ROUTE_FILTER_FILE: ai-issues/oversized-toggle-routes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-ui-inventory
          path: sitewide-inventory-evidence
          if-no-files-found: warn
          retention-days: 7
