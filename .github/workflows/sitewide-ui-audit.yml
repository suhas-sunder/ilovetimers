name: UI review (audit and release-candidate branches)
on:
  push:
    branches:
      - audit/2026-11-19-sitewide-ui-review
      - release/2026-11-19-ui-batch1-brand
    paths:
      - ai-issues/ui-audit-ci-trigger.txt

jobs:
  geometry-and-functional-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ui-regressions
      - run: npm run test:sitewide-ui
      - run: npm install --no-save --package-lock=false playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:page-geometry
        env:
          ILT_UI_CAPTURE_DIR: ui-review-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-screenshots
          path: ui-review-screenshots
          if-no-files-found: ignore
          retention-days: 7
